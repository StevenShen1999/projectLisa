openapi: 3.0.3
info:
  title: Our Tango
  description: |
    For my Elizabeth <3!
    REST API for a simple messaging application.
    Real-time messaging uses WebSocket at `ws(s)://host/ws?token=<jwt>`.
  version: 1.0.0

servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Registration and login
  - name: Users
    description: Contacts and message history

paths:
  # ── Auth ──────────────────────────────────────────────
  /api/auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login and receive a JWT access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ── Users ─────────────────────────────────────────────
  /api/users/me:
    get:
      operationId: getMe
      tags: [Users]
      summary: Get the current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/users/{userId}:
    get:
      operationId: getUserById
      tags: [Users]
      summary: Get another user's profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/users/me/contacts:
    get:
      operationId: getContacts
      tags: [Users]
      summary: Get contacts with latest message from each
      description: |
        Returns a paginated list of the current user's contacts, each with the
        most recent message exchanged. Ordered by latest message descending.
        Use the `before` cursor (the `created_at` of the last item on the current page)
        to fetch the next page.
      security:
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          description: Return contacts whose latest message is before this timestamp (ISO 8601). Omit for the first page.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/chats/{userId}/messages:
    get:
      operationId: getMessageHistory
      tags: [Users]
      summary: Get message history with a user
      description: |
        Returns paginated message history between the authenticated user and the
        specified user, ordered newest first. Use the `before` cursor (the `created_at`
        of the oldest message on the current page) to fetch older messages.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - name: before
          in: query
          description: Return messages before this timestamp (ISO 8601). Omit for the most recent messages.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistoryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # ── Auth ────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8

    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        access_token:
          type: string
          description: JWT access token

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        access_token:
          type: string

    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: "Machine-readable error code, e.g. AUTH_INVALID_CREDENTIALS"
        details:
          type: object
          nullable: true

    # ── Users ───────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string

    LatestMessageSummary:
      type: object
      properties:
        content:
          type: string
        created_at:
          type: string
          format: date-time
        is_mine:
          type: boolean
          description: True if the authenticated user sent this message

    ContactSummary:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        latest_message:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LatestMessageSummary'

    ContactsResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactSummary'
        has_more:
          type: boolean

    Message:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time

    MessageHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
