asyncapi: 3.0.0
info:
  title: Our Tango
  description: |
    For my Elizabeth!
    Real-time WebSocket API for the messaging application.
    All messages are wrapped in a WsEnvelope with an event type and payload.
    Connect at `ws(s)://host/ws?token=<jwt>`.
  version: 1.0.0

servers:
  production:
    host: api.example.com
    protocol: wss
    description: Production WebSocket server
  development:
    host: localhost:8080
    protocol: ws
    description: Local development WebSocket server

channels:
  ws:
    address: /ws
    description: |
      Main WebSocket endpoint. Authenticate by passing a JWT as a query parameter: `/ws?token=<jwt>`.
      All messages use the WsEnvelope wrapper format.
    parameters:
      token:
        description: JWT access token for authentication
    messages:
      sendMessage:
        $ref: '#/components/messages/SendMessage'
      newMessage:
        $ref: '#/components/messages/NewMessage'

operations:
  # ── Client → Server ────────────────────────────────────
  sendMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    summary: Send a message to another user
    description: |
      Client sends a plain-text message. The server assigns a message_id, persists it,
      and forwards it to the recipient. Use client_message_id for local message correlation.
    messages:
      - $ref: '#/channels/ws/messages/sendMessage'

  # ── Server → Client ────────────────────────────────────
  receiveNewMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    summary: Receive an incoming message from another user
    description: |
      Server delivers a message from another user. The client_message_id is echoed
      back to the original sender for correlation with their local pending message.
    messages:
      - $ref: '#/channels/ws/messages/newMessage'

components:
  messages:
    # ── Client → Server ──────────────────────────────────
    SendMessage:
      name: message:send
      title: Send Message
      summary: Send a plain-text message to a recipient
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SendMessageEnvelope'

    # ── Server → Client ──────────────────────────────────
    NewMessage:
      name: message:new
      title: New Message
      summary: Incoming message from another user
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NewMessageEnvelope'

  schemas:
    # ── Envelope wrappers ────────────────────────────────
    SendMessageEnvelope:
      type: object
      required: [event, payload]
      properties:
        event:
          type: string
          const: "message:send"
        payload:
          $ref: '#/components/schemas/SendMessagePayload'

    NewMessageEnvelope:
      type: object
      required: [event, payload]
      properties:
        event:
          type: string
          const: "message:new"
        payload:
          $ref: '#/components/schemas/NewMessagePayload'

    # ── Payloads ─────────────────────────────────────────
    SendMessagePayload:
      type: object
      required: [recipient_id, content, client_message_id]
      properties:
        recipient_id:
          type: string
          format: uuid
          description: Target user ID
        content:
          type: string
          description: Plain-text message content
        client_message_id:
          type: string
          description: Client-generated ID for local message correlation

    NewMessagePayload:
      type: object
      required: [message_id, sender_id, content, created_at, client_message_id]
      properties:
        message_id:
          type: string
          format: uuid
          description: Server-assigned message ID
        sender_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
        client_message_id:
          type: string
          description: Echoed from the sender's original request
